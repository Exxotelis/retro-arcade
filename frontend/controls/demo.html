<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Arcade Controls Demo</title>
  <link rel="stylesheet" href="controls.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
      color: #00ff88;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5em;
      text-shadow: 0 0 10px #00ff88;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.2em;
      color: #888;
    }

    .demo-area {
      position: relative;
      width: 100%;
      height: 400px;
      background: #0a0a0a;
      border: 3px solid #00ff88;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .player {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #00ff88;
      border-radius: 5px;
      transition: background-color 0.2s;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
    }

    .player.action-active {
      background: #ff00ff;
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
    }

    .controls-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .info-panel {
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid #00ff88;
      border-radius: 10px;
      padding: 15px;
    }

    .info-panel h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: #00ff88;
    }

    .info-panel p {
      margin: 5px 0;
      color: #aaa;
      font-size: 0.9em;
    }

    .log-panel {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid #00ff88;
      border-radius: 10px;
      padding: 15px;
      height: 200px;
      overflow-y: auto;
    }

    .log-panel h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: #00ff88;
    }

    .log-entry {
      font-size: 0.85em;
      color: #888;
      margin: 3px 0;
      padding: 3px 5px;
      border-left: 2px solid #00ff88;
      padding-left: 8px;
    }

    .log-entry.move {
      border-left-color: #00aaff;
    }

    .log-entry.action {
      border-left-color: #ff00ff;
    }

    .log-entry.stop {
      border-left-color: #ff8800;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      color: #00ff88;
      border: 2px solid #00ff88;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      transition: all 0.2s;
    }

    button:hover {
      background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    button:active {
      transform: translateY(1px);
    }

    @media (max-width: 768px) {
      .controls-section {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.8em;
      }

      .demo-area {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🕹️ Retro Arcade Controls Demo</h1>
      <p class="subtitle">Use arrow keys, WASD, or on-screen buttons to control the square</p>
    </header>

    <div class="demo-area" id="demoArea">
      <div class="player" id="player"></div>
    </div>

    <div class="controls-section">
      <div class="info-panel">
        <h2>📋 Instructions</h2>
        <p><strong>Keyboard:</strong> Arrow Keys or WASD to move</p>
        <p><strong>Action:</strong> Space or Enter</p>
        <p><strong>Touch/Mouse:</strong> Use on-screen controls (bottom-right)</p>
        <p><strong>Position:</strong> <span id="position">x: 0, y: 0</span></p>
        <p><strong>Speed:</strong> <span id="speed">5px per frame</span></p>
        
        <div class="button-group">
          <button onclick="changeTheme('dark')">Dark Theme</button>
          <button onclick="changeTheme('light')">Light Theme</button>
          <button onclick="changeTheme('retro')">Retro Theme</button>
        </div>
        <div class="button-group">
          <button onclick="changeSize('small')">Small</button>
          <button onclick="changeSize('medium')">Medium</button>
          <button onclick="changeSize('large')">Large</button>
        </div>
        <div class="button-group">
          <button onclick="resetPlayer()">Reset Position</button>
          <button onclick="clearLog()">Clear Log</button>
        </div>
      </div>

      <div class="log-panel">
        <h2>📊 Event Log</h2>
        <div id="eventLog"></div>
      </div>
    </div>
  </div>

  <script src="controls.js"></script>
  <script>
    // Player state
    let playerX = 0;
    let playerY = 0;
    const speed = 5;
    let isMoving = {
      up: false,
      down: false,
      left: false,
      right: false
    };
    let actionActive = false;

    const player = document.getElementById('player');
    const demoArea = document.getElementById('demoArea');
    const eventLog = document.getElementById('eventLog');
    const positionDisplay = document.getElementById('position');

    // Initialize controls
    Controls.init({
      size: 'medium',
      theme: 'dark'
    });

    // Listen for control events
    window.addEventListener('control-input', (e) => {
      const { type, direction, pressed, timestamp } = e.detail;
      
      // Log the event
      logEvent(type, direction, pressed, timestamp);

      // Handle movement
      if (type === 'move' && direction) {
        isMoving[direction] = pressed;
      } else if (type === 'stop' && direction) {
        isMoving[direction] = false;
      }

      // Handle action
      if (type === 'action') {
        actionActive = pressed;
        if (pressed) {
          player.classList.add('action-active');
        } else {
          player.classList.remove('action-active');
        }
      }

      // Console log for debugging
      console.log('Control Event:', e.detail);
    });

    // Animation loop
    function update() {
      let moved = false;

      if (isMoving.up) {
        playerY = Math.max(0, playerY - speed);
        moved = true;
      }
      if (isMoving.down) {
        playerY = Math.min(demoArea.clientHeight - 40, playerY + speed);
        moved = true;
      }
      if (isMoving.left) {
        playerX = Math.max(0, playerX - speed);
        moved = true;
      }
      if (isMoving.right) {
        playerX = Math.min(demoArea.clientWidth - 40, playerX + speed);
        moved = true;
      }

      if (moved) {
        player.style.left = playerX + 'px';
        player.style.top = playerY + 'px';
        positionDisplay.textContent = `x: ${playerX}, y: ${playerY}`;
      }

      requestAnimationFrame(update);
    }

    // Start animation loop
    update();

    // Log events to the panel
    function logEvent(type, direction, pressed, timestamp) {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      
      const time = new Date(timestamp).toLocaleTimeString();
      let message = `[${time}] ${type.toUpperCase()}`;
      
      if (direction) {
        message += ` - ${direction}`;
      }
      
      message += ` - pressed: ${pressed}`;
      
      entry.textContent = message;
      
      eventLog.insertBefore(entry, eventLog.firstChild);
      
      // Keep only last 50 entries
      while (eventLog.children.length > 50) {
        eventLog.removeChild(eventLog.lastChild);
      }
    }

    // Theme switching
    function changeTheme(theme) {
      Controls.destroy();
      Controls.init({ theme: theme, size: currentSize });
    }

    let currentSize = 'medium';
    function changeSize(size) {
      currentSize = size;
      Controls.destroy();
      Controls.init({ theme: currentTheme, size: size });
    }

    let currentTheme = 'dark';
    function changeTheme(theme) {
      currentTheme = theme;
      Controls.destroy();
      Controls.init({ theme: theme, size: currentSize });
    }

    // Reset player position
    function resetPlayer() {
      playerX = 0;
      playerY = 0;
      player.style.left = '0px';
      player.style.top = '0px';
      positionDisplay.textContent = `x: 0, y: 0`;
      isMoving = { up: false, down: false, left: false, right: false };
      actionActive = false;
      player.classList.remove('action-active');
    }

    // Clear log
    function clearLog() {
      eventLog.innerHTML = '';
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      playerX = Math.min(playerX, demoArea.clientWidth - 40);
      playerY = Math.min(playerY, demoArea.clientHeight - 40);
      player.style.left = playerX + 'px';
      player.style.top = playerY + 'px';
    });
  </script>
</body>
</html>
